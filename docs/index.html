<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RumpTACO Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌮%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b22;
      --panel-2: #1f232c;
      --border: #2a2f3a;
      --text: #e7e9ee;
      --muted: #8a93a6;
      --accent: #7cc4ff;
      --low: #4ade80;
      --med: #facc15;
      --high: #fb923c;
      --crit: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    header h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
    header h1 .emoji { margin-right: 8px; }
    header .meta { color: var(--muted); font-size: 13px; }
    .disclaimer { background: #2a1c1c; border: 1px solid #5a2d2d; color: #ffb4b4; font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .big { font-size: 48px; font-weight: 700; letter-spacing: -1px; }
    .big .unit { font-size: 22px; color: var(--muted); margin-left: 4px; }
    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }
    .col-8 { grid-column: span 8; }
    .col-12 { grid-column: span 12; }
    @media (max-width: 800px) {
      .col-4, .col-6, .col-8 { grid-column: span 12; }
    }
    .label-low { color: var(--low); } .label-med { color: var(--med); }
    .label-high { color: var(--high); } .label-crit { color: var(--crit); }
    .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 12px; }
    .bar > div { height: 100%; transition: width 0.5s ease; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .insight { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
    .statements { list-style: none; padding: 0; margin: 0; }
    .statements li { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
    .statements li:last-child { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 8px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .tbl td:first-child { color: var(--muted); }
    .tbl td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
    footer a { color: var(--accent); text-decoration: none; }
    .loading { text-align: center; padding: 60px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="emoji">🌮</span>RumpTACO Dashboard</h1>
      <div class="meta" id="meta">Loading...</div>
    </header>

    <div class="disclaimer">⚠️ 투자 권유 아님. 정보 제공 목적. 실험적 룰베이스 v0.1.</div>

    <div id="app" class="loading">데이터를 불러오는 중입니다...</div>

    <template id="tpl">
      <div class="grid">
        <div class="card col-6">
          <h2>TACO 확률</h2>
          <div class="big"><span id="taco-prob">--</span><span class="unit">%</span></div>
          <div class="sub" id="taco-label">--</div>
          <div class="bar"><div id="taco-bar" style="width:0%; background: var(--low);"></div></div>
          <div class="sub" id="taco-window">예상 윈도우: --</div>
        </div>

        <div class="card col-3">
          <h2>공격 지수 (Aggression)</h2>
          <div class="big"><span id="agg">--</span></div>
          <div class="bar"><div id="agg-bar" style="width:0%; background: var(--high);"></div></div>
          <div class="sub">발언 중 최고점</div>
        </div>

        <div class="card col-3">
          <h2>고통 지수 (Pain)</h2>
          <div class="big"><span id="pain">--</span></div>
          <div class="bar"><div id="pain-bar" style="width:0%; background: var(--med);"></div></div>
          <div class="sub">9개 시장·정치 지표 Z-score 합산</div>
        </div>

        <div class="card col-12">
          <h2>🧠 AI 인사이트</h2>
          <div class="insight" id="insight">--</div>
        </div>

        <div class="card col-8">
          <h2>회항 임계점 (Aggression × Pain)</h2>
          <canvas id="chart-threshold" height="240"></canvas>
          <div class="sub" id="threshold-explain">--</div>
        </div>

        <div class="card col-4">
          <h2>📊 시장 지표</h2>
          <table class="tbl"><tbody id="market-tbl"></tbody></table>
        </div>

        <div class="card col-12">
          <h2>📈 TACO 확률 추이 (최근 60일)</h2>
          <canvas id="chart-history" height="200"></canvas>
        </div>

        <div class="card col-8">
          <h2>🗣 주요 발언 Top 5</h2>
          <ul class="statements" id="statements"></ul>
        </div>

        <div class="card col-4">
          <h2>⚙️ 고통 지수 기여도</h2>
          <table class="tbl"><tbody id="pain-contrib"></tbody></table>
        </div>
      </div>
    </template>

    <footer>
      <p>RumpTACO · <a href="https://github.com/niken2025/RumpTACO" target="_blank">GitHub</a> · 매일 KST 06:00 자동 갱신</p>
    </footer>
  </div>

  <script>
    const COLORS = {
      low: getComputedStyle(document.documentElement).getPropertyValue('--low').trim(),
      med: getComputedStyle(document.documentElement).getPropertyValue('--med').trim(),
      high: getComputedStyle(document.documentElement).getPropertyValue('--high').trim(),
      crit: getComputedStyle(document.documentElement).getPropertyValue('--crit').trim(),
      muted: getComputedStyle(document.documentElement).getPropertyValue('--muted').trim(),
      accent: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),
    };

    function probColor(p) {
      if (p >= 80) return COLORS.crit;
      if (p >= 60) return COLORS.high;
      if (p >= 40) return COLORS.med;
      return COLORS.low;
    }
    function probLabel(p) {
      if (p >= 80) return { txt: '매우 높음', cls: 'label-crit' };
      if (p >= 60) return { txt: '높음', cls: 'label-high' };
      if (p >= 40) return { txt: '중간', cls: 'label-med' };
      return { txt: '낮음', cls: 'label-low' };
    }

    const MARKET_LABELS = {
      treasury_10y: '10Y Treasury', sp500: 'S&P 500', djia: 'Dow Jones',
      nasdaq: 'NASDAQ', vix: 'VIX', wti_usd: 'WTI', breakeven_5y: '5Y BEI',
      btc_usd: 'BTC (USD)', trump_approval: '트럼프 지지율',
    };

    function fmtNum(v) {
      if (v == null) return '—';
      if (Math.abs(v) >= 1000) return v.toLocaleString('en-US', { maximumFractionDigits: 2 });
      return v.toFixed(2);
    }

    async function main() {
      let data;
      try {
        const res = await fetch('data/latest.json?' + Date.now());
        if (!res.ok) throw new Error('latest.json 로드 실패');
        data = await res.json();
      } catch (e) {
        document.getElementById('app').innerHTML =
          '<div class="card"><h2>데이터 없음</h2><p>아직 리포트가 생성되지 않았습니다. <code>python cli.py daily</code> 실행 또는 GitHub Actions 실행 후 이 페이지를 새로고침하세요.</p></div>';
        return;
      }

      const tpl = document.getElementById('tpl').content.cloneNode(true);
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.classList.remove('loading');
      app.appendChild(tpl);

      document.getElementById('meta').textContent =
        `${data.date} · ${new Date(data.generated_at).toLocaleString('ko-KR')} · 모델 ${data.model_version}`;

      // TACO probability
      const prob = data.taco_probability || 0;
      const { txt: lbl, cls } = probLabel(prob);
      const color = probColor(prob);
      document.getElementById('taco-prob').textContent = prob.toFixed(1);
      const tacoLabel = document.getElementById('taco-label');
      tacoLabel.textContent = lbl;
      tacoLabel.className = 'sub ' + cls;
      const bar = document.getElementById('taco-bar');
      bar.style.width = Math.min(prob, 100) + '%';
      bar.style.background = color;
      const win = data.expected_window_hours;
      document.getElementById('taco-window').textContent =
        win ? `예상 윈도우: ${win[0].toFixed(0)}~${win[1].toFixed(0)}시간` : '예상 윈도우: 임계점 미도달';

      // Aggression / Pain
      const agg = data.aggression_score || 0;
      document.getElementById('agg').textContent = agg.toFixed(1);
      document.getElementById('agg-bar').style.width = Math.min(agg, 100) + '%';
      document.getElementById('agg-bar').style.background = probColor(agg);

      const pain = data.pain_index || 0;
      document.getElementById('pain').textContent = pain.toFixed(1);
      document.getElementById('pain-bar').style.width = Math.min(pain, 100) + '%';
      document.getElementById('pain-bar').style.background = probColor(pain);

      // Insight
      document.getElementById('insight').textContent = data.insight || '(인사이트 없음)';

      // Market table
      const mtbl = document.getElementById('market-tbl');
      for (const [k, label] of Object.entries(MARKET_LABELS)) {
        const v = data.market_snapshot?.[k];
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${label}</td><td>${fmtNum(v)}</td>`;
        mtbl.appendChild(tr);
      }

      // Statements
      const sul = document.getElementById('statements');
      if (!data.top_statements || !data.top_statements.length) {
        sul.innerHTML = '<li style="color: var(--muted);">(수집된 발언 없음)</li>';
      } else {
        data.top_statements.forEach(s => {
          const li = document.createElement('li');
          const badge = `<span class="badge" style="background: ${probColor(s.aggression_score || 0)}20; color: ${probColor(s.aggression_score || 0)}; border: 1px solid ${probColor(s.aggression_score || 0)};">${(s.aggression_score ?? 0).toFixed(0)}</span>`;
          const link = s.url ? `<a href="${s.url}" target="_blank" style="color: var(--accent); text-decoration: none;">출처↗</a>` : '';
          li.innerHTML = `${badge}${escapeHtml(s.content || '').slice(0, 220)}… ${link}`;
          sul.appendChild(li);
        });
      }

      // Pain contributions
      const ctbl = document.getElementById('pain-contrib');
      const contribs = Object.entries(data.pain?.contributions || {})
        .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
      contribs.forEach(([k, v]) => {
        const tr = document.createElement('tr');
        const sign = v >= 0 ? '+' : '';
        const c = v >= 0 ? COLORS.high : COLORS.low;
        tr.innerHTML = `<td>${MARKET_LABELS[k] || k}</td><td style="color:${c};">${sign}${v.toFixed(3)}</td>`;
        ctbl.appendChild(tr);
      });

      // Threshold scatter
      drawThreshold(data);

      // History
      try {
        const hres = await fetch('data/history.json?' + Date.now());
        if (hres.ok) drawHistory(await hres.json());
      } catch {}
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function drawThreshold(data) {
      const ctx = document.getElementById('chart-threshold');
      const current = { x: data.aggression_score || 0, y: data.pain_index || 0 };
      // 임계점 곡선: aggression × pain composite sigmoid가 60/80% 되는 점들
      const highCurve = [];
      const critCurve = [];
      for (let a = 0; a <= 100; a += 2) {
        // composite = 0.55*a + 0.45*p + 0.6*a*p  (scale 0..1)
        // 60%: sigmoid(4*(raw-0.55))=0.6 -> raw = 0.55 + ln(1.5)/4 ≈ 0.651
        // 80%: raw ≈ 0.55 + ln(4)/4 ≈ 0.897
        for (const [curve, target] of [[highCurve, 0.651], [critCurve, 0.897]]) {
          const A = a / 100;
          // solve 0.55*A + 0.45*P + 0.6*A*P = target  → P = (target - 0.55A) / (0.45 + 0.6A)
          const P = (target - 0.55 * A) / (0.45 + 0.6 * A);
          if (P >= 0 && P <= 1) curve.push({ x: a, y: P * 100 });
        }
      }
      new Chart(ctx, {
        type: 'scatter',
        data: {
          datasets: [
            { label: '회항 임계점 60%', data: highCurve, showLine: true, borderColor: COLORS.high,
              backgroundColor: 'transparent', pointRadius: 0, borderWidth: 2, borderDash: [6, 4] },
            { label: '회항 임계점 80%', data: critCurve, showLine: true, borderColor: COLORS.crit,
              backgroundColor: 'transparent', pointRadius: 0, borderWidth: 2, borderDash: [6, 4] },
            { label: '오늘', data: [current], backgroundColor: COLORS.accent,
              borderColor: '#fff', borderWidth: 2, pointRadius: 9, pointHoverRadius: 11 },
          ],
        },
        options: {
          plugins: { legend: { labels: { color: COLORS.muted } } },
          scales: {
            x: { min: 0, max: 100, title: { display: true, text: 'Aggression', color: COLORS.muted },
                 ticks: { color: COLORS.muted }, grid: { color: '#2a2f3a' } },
            y: { min: 0, max: 100, title: { display: true, text: 'Pain Index', color: COLORS.muted },
                 ticks: { color: COLORS.muted }, grid: { color: '#2a2f3a' } },
          },
        },
      });
      document.getElementById('threshold-explain').textContent =
        `점선은 TACO 확률 60%/80% 임계선. 오늘 위치가 80% 선 위에 있을수록 번복 가능성 높음.`;
    }

    function drawHistory(hist) {
      const ctx = document.getElementById('chart-history');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: hist.map(h => h.date),
          datasets: [
            { label: 'TACO 확률', data: hist.map(h => h.taco_probability), borderColor: COLORS.accent,
              backgroundColor: COLORS.accent + '30', tension: 0.3, fill: true },
            { label: 'Aggression', data: hist.map(h => h.aggression_score), borderColor: COLORS.high,
              backgroundColor: 'transparent', tension: 0.3, borderDash: [4, 4] },
            { label: 'Pain', data: hist.map(h => h.pain_index), borderColor: COLORS.med,
              backgroundColor: 'transparent', tension: 0.3, borderDash: [4, 4] },
          ],
        },
        options: {
          plugins: { legend: { labels: { color: COLORS.muted } } },
          scales: {
            x: { ticks: { color: COLORS.muted }, grid: { color: '#2a2f3a' } },
            y: { min: 0, max: 100, ticks: { color: COLORS.muted }, grid: { color: '#2a2f3a' } },
          },
        },
      });
    }

    main();
  </script>
</body>
</html>
